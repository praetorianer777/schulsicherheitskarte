# Throwaway database for the Go tests. run-tests.sh derives TEST_DB_PORT from
# the checkout path, so a suite running in a parallel worktree binds a different
# port and does not tear this one down.
services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: ssk
      POSTGRES_PASSWORD: ssk
      POSTGRES_DB: ssk_test
    ports:
      - "${TEST_DB_PORT:-55432}:5432"
    # The data is thrown away with the container, so durability buys nothing and
    # costs a noticeable amount on an import-heavy suite.
    command: >
      postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssk -d ssk_test"]
      interval: 2s
      timeout: 3s
      retries: 30
