services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ssk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssk}
      POSTGRES_DB: ${POSTGRES_DB:-ssk}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -h forces a TCP connection. Without it the check passes against the
      # temporary socket-only server that initdb runs while the database is
      # still being created, and `up --wait` returns before anything can
      # actually connect.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-ssk} -d ${POSTGRES_DB:-ssk}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Applies the schema and exits. Everything that talks to the database waits
  # for it to complete, so no service ever starts against a half-built schema.
  migrate:
    image: ghcr.io/praetorianer777/schulsicherheitskarte/migrate:${IMAGE_TAG:-main}
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ssk}:${POSTGRES_PASSWORD:-ssk}@postgres:5432/${POSTGRES_DB:-ssk}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    # image and build side by side: a server pulls the published image, a
    # checkout can still build it. `docker compose pull` fetches, `up --build`
    # rebuilds from source.
    image: ghcr.io/praetorianer777/schulsicherheitskarte/api:${IMAGE_TAG:-main}
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ssk}:${POSTGRES_PASSWORD:-ssk}@postgres:5432/${POSTGRES_DB:-ssk}?sslmode=disable
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    ports:
      # The bind address is part of the configuration, not just the port: with
      # a reverse proxy on another machine, publishing to every interface means
      # the API can be reached around the proxy.
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The image has no shell and no curl, so the binary answers for itself:
      # a health probe that needs a second tool is a second thing to break.
      test: ["CMD", "/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  web:
    # Serves the built frontend and forwards /api to the api service, so the
    # page and its data share one origin and the reverse proxy in front needs
    # one host rather than two.
    image: ghcr.io/praetorianer777/schulsicherheitskarte/web:${IMAGE_TAG:-main}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: web
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8090}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Not started by `up`: imports are run on demand with
  #   docker compose run --rm importer accidents -years 2024-2025
  importer:
    profiles: ["tools"]
    image: ghcr.io/praetorianer777/schulsicherheitskarte/importer:${IMAGE_TAG:-main}
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: importer
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ssk}:${POSTGRES_PASSWORD:-ssk}@postgres:5432/${POSTGRES_DB:-ssk}?sslmode=disable
    volumes:
      - ../regions.yaml:/regions.yaml:ro
      - importer-cache:/data/cache
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  importer-cache:
