# Builds the three service images and publishes them, so that an installation
# does not need a Go toolchain and two machines updated on the same day run the
# same bytes rather than whatever the base image happened to be.
name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One image per target rather than one job building all three: a failure
      # names the image it belongs to, and the three build in parallel.
      matrix:
        target: [api, migrate, importer]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: ${{ matrix.target }}
          # amd64 only, which is what this is deployed on. A second
          # architecture would mean either emulating the Go toolchain or
          # pinning the build stage to the build platform, and that pin makes
          # the Dockerfile unbuildable without buildx — which would take local
          # `up --build` away from anyone who does not have it.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
