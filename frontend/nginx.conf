server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The API is reached under the same origin as the page. One hostname in the
    # reverse proxy is enough, and no CORS rule has to exist anywhere.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://api:8080/healthz;
    }

    # Hashed asset names, so they can be cached for as long as they exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A single-page app: every other path is answered by the app itself, which
    # then decides what to show.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
